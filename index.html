<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wincon Shooting</title>
<style>
:root{color-scheme:dark;--ac:#00e5ff;--mg:#ff2bd6}
html,body{margin:0;height:100%;background:#0b1020;color:#eaf6ff;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);box-sizing:border-box;text-shadow:0 0 6px #000}
#tl{position:absolute;left:14px;top:12px;font-weight:700;letter-spacing:.08em;line-height:1.5}
#mm{position:absolute;right:14px;top:12px;border:2px solid #fff6;border-radius:50%;background:#0a2a4a99}
#cx{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;border:1px solid #fff;box-shadow:0 0 4px #000}
#sc{position:absolute;left:50%;top:50%;width:min(70vh,70vw);height:min(70vh,70vw);margin:calc(min(70vh,70vw)/-2);border-radius:50%;box-shadow:0 0 0 100vmax #000;display:none;background:linear-gradient(#000,#000) center/2px 100% no-repeat,linear-gradient(#000,#000) center/100% 2px no-repeat}
#msg{position:absolute;top:20%;width:100%;text-align:center;font-size:30px;font-weight:800;letter-spacing:.15em;color:var(--ac);opacity:0;transition:opacity .4s}
#pr{position:absolute;top:60%;width:100%;text-align:center;font-size:16px;color:#ffee88}
#bl{position:absolute;left:14px;bottom:16px;width:280px}
.bar{height:14px;border:1px solid #fff8;background:#0008;margin-top:4px}.bar div{height:100%}
#br{position:absolute;right:18px;bottom:16px;text-align:right}
#wn{font-size:16px;letter-spacing:.12em}#am{font-size:42px;font-weight:800}#am small{font-size:20px;opacity:.7}
#sl{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px}
#sl div{min-width:64px;padding:5px 8px;border:2px solid #fff4;background:#0008;font-size:12px;text-align:center}#sl .on{box-shadow:0 0 12px currentColor}
#it{position:absolute;right:18px;bottom:110px;font-size:13px;line-height:1.6}
#vg{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px #f03;opacity:0;transition:opacity .3s}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#050a18ee;text-align:center}
#ov h1{font-size:clamp(30px,6vw,60px);margin:0;color:var(--ac);text-shadow:0 0 24px var(--ac);letter-spacing:.1em}
#ov button,#ps button,#go button{font:700 18px inherit;padding:10px 28px;min-width:380px;background:#0c2a40;color:#fff;border:2px solid var(--ac);cursor:pointer}#ov button:hover,#ps button:hover,#go button:hover{background:var(--ac);color:#000}
#ov p,#ov label{margin:0;font-size:13px;opacity:.85;line-height:1.6}
#ov input[type=range]{width:110px;vertical-align:middle}
#kc{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#050a18f5}
#kc .pn{width:min(940px,94vw);max-height:94vh;display:flex;flex-direction:column;gap:10px}
#kc h2{margin:0;text-align:center;color:var(--ac);letter-spacing:.1em;text-shadow:0 0 16px var(--ac)}
#kc .gr{overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:4px 28px;padding:4px 6px}
#kc .rw{display:flex;align-items:center;gap:6px}#kc .rw span{flex:1;font-size:14px}
#kc button{font:700 13px "Segoe UI",system-ui,sans-serif;min-width:104px;padding:6px 8px;background:#0c2a40;color:#fff;border:1px solid #fff4;cursor:pointer}
#kc button:hover{border-color:var(--ac)}#kc button:focus-visible{outline:2px solid var(--mg)}
#kc .ft{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#kc .ft button{min-width:170px;padding:9px 14px;font-size:15px;border:2px solid var(--ac)}#kc .ft button:hover{background:var(--ac);color:#000}
#kcm{min-height:18px;text-align:center;font-size:13px;color:#ffee88}
#kb{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000d;font-size:22px;font-weight:700;color:var(--ac);text-align:center;padding:0 16px}
#kb small{font-size:14px;color:#fff;opacity:.85;font-weight:400;line-height:1.6}
#ps,#go{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#050a18ee;text-align:center}
#ps h1,#go h1{font-size:clamp(28px,5vw,52px);margin:0;color:var(--ac);text-shadow:0 0 24px var(--ac);letter-spacing:.1em}
.lb{width:min(420px,80vw);height:14px;border:1px solid #fff8;background:#0008;margin:0 auto}.lb div{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--mg))}
#gl{font-size:20px;font-weight:700}#gl.up{color:#ffee88;font-size:28px;text-shadow:0 0 14px #fc0}
#tp{animation:up 1.6s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 0 18px #ffc83d)}
@keyframes up{from{transform:translateY(90px) scale(.5);opacity:0}to{transform:none;opacity:1}}
#tg{position:absolute;right:18px;bottom:200px;width:110px;font-size:10px;text-align:right}
#tg i{display:block;height:4px;border:1px solid #fff6;background:#0008;margin-top:1px}#tg i b{display:block;height:100%}
#lu{position:absolute;left:14px;top:104px}
.fl{font-size:14px;font-weight:800;color:#9ff;animation:fl 2.2s both}.fl.up{color:#ffee88;font-size:18px}
@keyframes fl{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
body{user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#tl,#tr,#kf div{background:#0a1a2acc;border:1px solid #4df5ff44;border-radius:6px;padding:5px 10px;backdrop-filter:blur(4px)}
#tr{position:absolute;right:14px;top:156px;text-align:right;font-weight:700;letter-spacing:.06em;line-height:1.45;font-size:15px}#tr small{font-weight:400;opacity:.85;font-size:12px}
#kf{position:absolute;right:14px;top:236px;display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:12px}#kf div{padding:3px 8px;animation:kf 4.2s both}
@keyframes kf{0%{opacity:0;transform:translateX(30px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#sl div{border-radius:4px;background:#0a1a2acc}#sl div.on{box-shadow:0 0 12px currentColor}
#sp{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#050a18f5;text-align:center}
#sp h2{margin:0;color:var(--ac);letter-spacing:.1em;text-shadow:0 0 16px var(--ac)}#sp label{display:flex;gap:10px;align-items:center;justify-content:space-between;width:min(420px,88vw);font-size:15px}
#sp select{background:#0c2a40;color:#fff;border:1px solid var(--ac);padding:6px 10px;font-size:14px}#sp small{opacity:.8;max-width:min(520px,90vw)}
#sp button{padding:9px 28px;font-size:15px;font-weight:700;background:#0c2a40;color:#fff;border:2px solid var(--ac);cursor:pointer}#sp button:hover{background:var(--ac);color:#000}
#go.win{background:radial-gradient(circle at 50% 38%,#4a3a0aee,#050a18f5 70%)}
#go.win::before{content:"";position:absolute;left:50%;top:38%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(#ffd54a22 0 6deg,transparent 6deg 18deg);animation:sp 30s linear infinite;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
#go.win h1{animation:vt 1.2s ease-out both,gl 1.6s ease-in-out infinite alternate;color:#ffd54a;text-shadow:0 0 30px #ffb300}
@keyframes vt{from{transform:scale(2.4);opacity:0;letter-spacing:.6em}to{transform:none;opacity:1}}@keyframes gl{to{text-shadow:0 0 60px #ffe082,0 0 12px #fff}}
#cf{position:absolute;inset:0;overflow:hidden;pointer-events:none}#cf i{position:absolute;top:-6vh;width:9px;height:14px;animation:cf linear infinite}
@keyframes cf{to{transform:translateY(112vh) rotate(720deg)}}
#tp .ar{transform-box:fill-box;transform-origin:50% 100%;animation:ar 1.6s ease-out both}#tp .tr{animation:lift 1.6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes ar{from{transform:rotate(55deg) scaleY(.7)}to{transform:none}}@keyframes lift{from{transform:translateY(62px)}to{transform:none}}
#gd{position:fixed;right:16px;top:14px;color:#ffd028;font:bold 18px sans-serif;text-shadow:0 0 6px #000;z-index:5}</style>
</head>
<body>
<div id="hud">
<div id="tl"></div><canvas id="mm" width="130" height="130"></canvas>
<div id="cx"></div><div id="sc"></div><div id="msg"></div><div id="pr"></div>
<div id="bl"><div class="bar"><div id="shf" style="background:#3ea6ff"></div></div><div class="bar"><div id="hpf" style="background:#4cd137"></div></div></div>
<div id="it"></div><div id="br"><div id="wn"></div><div id="am"></div><div id="rl" style="color:#fe3;height:20px"></div></div>
<div id="tr"></div><div id="kf"></div><div id="tg"></div><div id="lu"></div><div id="sl"></div><div id="vg"></div></div>
<div id="ov"><h1>NEON FRONTIER</h1><div id="ot"></div><div id="lvt" style="width:min(420px,80vw)"><div id="lvn" style="font-weight:700;margin-bottom:4px"></div><div class="lb"><div id="lvf"></div></div></div>
<button data-m="normal">NORMAL ― 100人バトル・1回死んだら終わり</button>
<button data-m="reload">RELOAD TEAM ― 4人チーム・ダウン/リブート・残機1固定</button>
<button data-m="solo">RELOAD SOLO ― 個人戦・死んだら残機-1・残機3</button>
<button data-m="fever">FEVER ― 弾無限・敵が超強い</button>
<button id="kcb" type="button">KEY CONFIG ― キー設定</button>
<button id="spb" type="button">SETTINGS ― 設定(チーム人数・敵の強さ)</button>
<button id="lvr" type="button" style="min-width:0;font-size:12px;padding:4px 14px">LEVEL RESET</button>
<p><label>感度<input id="s_sens" type="range" min=".3" max="2" step=".1"></label> <label>FOV<input id="s_fov" type="range" min="60" max="100"></label> <label>音量<input id="s_vol" type="range" min="0" max="1" step=".05"></label> <label><input id="s_fp" type="checkbox">1人称</label> <label><input id="s_inv" type="checkbox">Y反転</label></p>
<p id="help"></p>
<p>ゲームパッド: Lスティック移動 Rスティック視点 RT撃つ LT ADS A跳ぶ X装填 Y拾う B滑る LB/RB武器</p></div>
<div id="ps"><h1>PAUSE</h1><button id="prs">RESUME ― 再開</button><button id="kcb2" type="button">KEY CONFIG ― キー設定</button><button id="pre">RETIRE ― 試合を終了</button></div>
<div id="go"><h1 id="gt"></h1><svg id="tp" viewBox="0 0 160 190" width="190" style="display:none;overflow:visible"><g fill="#8fd3ff" stroke="#fff8" stroke-width="2"><circle cx="80" cy="150" r="14"/><rect x="62" y="162" width="36" height="26" rx="8"/></g>
<rect class="ar" x="50" y="104" width="10" height="64" rx="5" fill="#8fd3ff"/><rect class="ar" x="100" y="104" width="10" height="64" rx="5" fill="#8fd3ff"/>
<g class="tr"><g fill="#ffc83d" stroke="#fff8" stroke-width="2"><path d="M55 14h50v28c0 17-11 28-25 28S55 59 55 42z"/><rect x="74" y="70" width="12" height="14"/><rect x="60" y="84" width="40" height="10" rx="3"/></g><path d="M55 22H40c0 18 7 28 18 30M105 22h15c0 18-7 28-18 30" fill="none" stroke="#ffc83d" stroke-width="6"/></g></svg><div id="cf"></div><p id="gs" style="font-size:18px"></p><div id="gl"></div><div class="lb"><div id="gf"></div></div><button id="grt">RETRY ― もう一度</button><button id="gtt">TITLE ― タイトルへ</button></div>
<div id="sp"><h2>SETTINGS</h2>
<label>チーム人数(味方も敵も同数)<select id="s_ts"><option value="0">自動(RELOADは4人)</option><option value="1">1人</option><option value="2">2人</option><option value="3">3人</option><option value="4">4人</option></select></label>
<label>敵の強さ<select id="s_df"><option value="0">EASY</option><option value="1">NORMAL</option><option value="2">HARD</option></select></label>
<p id="gpn"></p><small>SOLOは常に個人戦(残機3)です。RELOADのチーム戦は、自分も敵チームも残機1固定です。</small><button id="spc" type="button">閉じる</button></div>
<div id="kc"><div class="pn"><h2>KEY CONFIG</h2><div class="gr" id="kg"></div><div id="kcm"></div><div class="ft"><button id="kdef" type="button">初期設定に戻す</button><button id="kcl" type="button">閉じる</button></div></div></div>
<div id="kb"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=i=>document.getElementById(i),rnd=Math.random,PI=Math.PI;
const S={sens:1,fov:75,vol:.6,fp:1,inv:0,ts:0,df:1};try{Object.assign(S,JSON.parse(localStorage.getItem('nf_s2')||'{}'))}catch(e){}
for(const k of['sens','fov','vol']){const e=$('s_'+k);e.value=S[k];e.oninput=()=>{S[k]=+e.value;sv()}}
for(const k of['fp','inv']){const e=$('s_'+k);e.checked=!!S[k];e.onchange=()=>{S[k]=e.checked?1:0;sv()}}
function sv(){try{localStorage.setItem('nf_s2',JSON.stringify(S))}catch(e){}if(MS)MS.gain.value=S.vol}
// key config: 各アクションにメイン/サブの2つまで割り当て可(キーボード・マウスボタン)
const ACT=[['fwd','前進',['KeyW']],['back','後退',['KeyS']],['left','左移動',['KeyA']],['right','右移動',['KeyD']],['sprint','走る',['ShiftLeft']],['slide','スライド',['KeyC','ControlLeft']],['crawl','匍匐(かがみ移動)',['KeyZ']],['jump','ジャンプ',['Space']],['fire','撃つ',['Mouse0']],['ads','ADS(のぞく)',['Mouse2']],['reload','装填',['KeyR']],['use','拾う/開ける',['KeyE']],['drop','武器を捨てる',['KeyG']],['view','視点切替',['KeyV']],
 ['w1','武器1',['Digit1']],['w2','武器2',['Digit2']],['w3','武器3',['Digit3']],['w4','武器4',['Digit4']],['w5','武器5',['Digit5']],['wprev','前の武器',[]],['wnext','次の武器',[]],
 ['h1','包帯',['Digit6']],['h2','ミニシールド',['Digit7']],['h3','デカポ',['Digit8']],['h4','メディキット',['Digit9']],['gr','手榴弾',['Digit0']]];
const KB={};let binding=null;
function kbDef(){ACT.forEach(a=>KB[a[0]]=[a[2][0]||'',a[2][1]||'']);}kbDef();
try{const q=JSON.parse(localStorage.getItem('nf_k')||'{}');for(const a of ACT){const v=q[a[0]];if(Array.isArray(v))KB[a[0]]=[typeof v[0]==='string'?v[0]:'',typeof v[1]==='string'?v[1]:''];}}catch(e){}
function kbSave(){try{localStorage.setItem('nf_k',JSON.stringify(KB))}catch(e){}}
const ia=a=>KB[a].some(c=>c&&K[c]);
function kname(c){if(!c)return'―';if(c.startsWith('Mouse'))return['左クリック','中クリック','右クリック','マウス戻る','マウス進む'][+c.slice(5)]||c;
 const m={ShiftLeft:'左Shift',ShiftRight:'右Shift',ControlLeft:'左Ctrl',ControlRight:'右Ctrl',AltLeft:'左Alt',AltRight:'右Alt',Space:'Space',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Backquote:'`',Minus:'-',Equal:'=',Comma:',',Period:'.',Slash:'/',Semicolon:';',Quote:"'",BracketLeft:'[',BracketRight:']',Backslash:'\\',IntlYen:'¥'};
 return m[c]||c.replace(/^Key|^Digit/,'').replace(/^Numpad/,'テンキー');}
function kbHelp(){const g=a=>KB[a].filter(Boolean).map(kname).join('/')||'未設定';
 $('help').innerHTML='移動 '+g('fwd')+' '+g('left')+' '+g('back')+' '+g('right')+' ／ 走る '+g('sprint')+' ／ スライド '+g('slide')+' ／ ジャンプ '+g('jump')+' ／ 撃つ '+g('fire')+' ／ ADS '+g('ads')+' ／ 装填 '+g('reload')+'<br>武器 '+[1,2,3,4,5].map(i=>g('w'+i)).join(' ')+'(ホイールでも切替) ／ 包帯 '+g('h1')+' ミニシールド '+g('h2')+' デカポ '+g('h3')+' メディキット '+g('h4')+' ／ 拾う '+g('use')+' ／ 捨てる '+g('drop')+' ／ 視点 '+g('view');}
function kbBuild(){const gr=$('kg');gr.innerHTML='';for(const a of ACT){const r=document.createElement('div');r.className='rw';const s=document.createElement('span');s.textContent=a[1];r.appendChild(s);
  for(let i=0;i<2;i++){const b=document.createElement('button');b.type='button';b.textContent=kname(KB[a[0]][i]);b.onclick=()=>kbAsk(a,i);r.appendChild(b);}gr.appendChild(r);}kbHelp();}
function kbAsk(a,i){if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();binding={a,i};const kb=$('kb');kb.innerHTML=a[1]+'('+(i?'サブ':'メイン')+')に割り当てるキー／ボタンを押してください<small>Esc: キャンセル ／ Delete: 割り当てを解除 ／ マウスのボタンも使えます</small>';kb.style.display='flex';}
function kbSet(code){const{a,i}=binding;binding=null;let note='';
 if(code)for(const o of ACT)for(let j=0;j<2;j++)if(KB[o[0]][j]===code&&!(o===a&&j===i)){KB[o[0]][j]='';if(o!==a)note='「'+o[1]+'」から移しました';}
 KB[a[0]][i]=code;kbSave();kbBuild();$('kcm').textContent=note;setTimeout(()=>$('kb').style.display='none',200);}
$('kcb').onclick=()=>{kbBuild();$('kcm').textContent='';$('kc').style.display='flex';};
$('kcl').onclick=()=>{$('kc').style.display='none';};
$('kdef').onclick=()=>{kbDef();kbSave();kbBuild();$('kcm').textContent='初期設定に戻しました';};
kbBuild();$('kcb2').onclick=$('kcb').onclick;
// 設定画面・難易度
const DM=()=>1.3*[.75,1,1.3][S.df==null?1:S.df],HM=()=>1.3*[.75,1,1.3][S.df==null?1:S.df];
function gpInfo(){const n=[...(navigator.getGamepads?navigator.getGamepads():[])].filter(Boolean).length;$('gpn').textContent='接続中のコントローラー: '+n+'台';}
$('spb').onclick=()=>{$('s_ts').value=S.ts||0;$('s_df').value=S.df==null?1:S.df;gpInfo();$('sp').style.display='flex';};
$('s_ts').onchange=()=>{S.ts=+$('s_ts').value;sv();};$('s_df').onchange=()=>{S.df=+$('s_df').value;sv();};$('spc').onclick=()=>{$('sp').style.display='none';};
addEventListener('gamepadconnected',gpInfo);addEventListener('gamepaddisconnected',gpInfo);
function feed(t){const d=document.createElement('div');d.textContent=t;$('kf').appendChild(d);while($('kf').children.length>5)$('kf').removeChild($('kf').children[0]);setTimeout(()=>d.remove(),4300);}
function confetti(){const c=$('cf');c.innerHTML='';const col=['#ffd54a','#ff4d8d','#4df5ff','#7cff6b','#b388ff'];for(let i=0;i<90;i++){const d=document.createElement('i');d.style.left=rnd()*100+'%';d.style.background=col[i%5];d.style.animationDuration=2.5+rnd()*3+'s';d.style.animationDelay=rnd()*3+'s';d.style.width=6+rnd()*6+'px';c.appendChild(d);}}
// プレイ中のブラウザ操作ブロック
addEventListener('contextmenu',e=>e.preventDefault());addEventListener('dragstart',e=>e.preventDefault());
addEventListener('beforeunload',e=>{if(playing){e.preventDefault();e.returnValue='';}});
addEventListener('keydown',e=>{if(!playing)return;if(e.key==='Tab'||/^F([1-9]|10)$/.test(e.key)||((e.ctrlKey||e.metaKey)&&/^[spfgudohjkle]$/i.test(e.key))||(e.altKey&&/^Arrow(Left|Right)$/.test(e.key)))e.preventDefault();},true);
addEventListener('wheel',e=>{if(playing&&e.ctrlKey)e.preventDefault();},{passive:false});
try{history.pushState(null,'',location.href);addEventListener('popstate',()=>{if(playing)history.pushState(null,'',location.href);});}catch(e){}
// level: 厳しめのXP曲線。キル+20XP、試合終了でボーナス
const LV={lv:1,xp:0};try{Object.assign(LV,JSON.parse(localStorage.getItem('nf_lv')||'{}'))}catch(e){}
const need=l=>300+l*150;
function lvSave(){try{localStorage.setItem('nf_lv',JSON.stringify(LV))}catch(e){}}
function lvUi(){$('lvn').textContent='Lv.'+LV.lv+' ／ XP '+Math.floor(LV.xp)+' / '+need(LV.lv);$('lvf').style.width=Math.min(100,LV.xp/need(LV.lv)*100)+'%';}

{const as=[],sw=[];towns.forEach(([tx,tz])=>{for(const ax of[0,1])for(let k=-8;k<=8;k++){const d=k*6,x=ax?tx+d:tx,z=ax?tz:tz+d,g=Hh(x,z);if(g<.35)continue;as.push([x,g+.03,z,6.1,.06,6.1]);for(const o of[-3.75,3.75])sw.push(ax?[x,g+.08,z+o,6.1,.16,1.5]:[x+o,g+.08,z,1.5,.16,6.1]);}});

{const wl=[],wd=[],bk=[],LIT=new T.MeshBasicMaterial({color:0xffe9a0});

 inst(BX,new T.MeshStandardMaterial({color:0x1a2433,metalness:.6,roughness:.3}),wd);inst(BX,LIT,wl);inst(BX,MS(0x777777),bk);}
